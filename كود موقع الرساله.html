<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For You ❤️</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Tajawal:wght@300;400;500&display=swap" rel="stylesheet">

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    padding: 0;
    font-family: "Tajawal", "Tahoma", sans-serif;
    overflow-x: hidden;
    overflow-y: auto;
    background: radial-gradient(ellipse at center, #2a0a1e 0%, #150410 60%, #000000 100%);
    color: white;
    min-height: 100vh;
    width: 100vw;
}

/* ============ الخلفية ============ */
.background {
    position: fixed;
    width: 100%;
    height: 100%;
    overflow: hidden;
    top: 0;
    left: 0;
    z-index: 1;
}

.glow {
    position: absolute;
    width: 500px;
    height: 500px;
    background: radial-gradient(circle, rgba(255,77,109,0.25) 0%, transparent 70%);
    border-radius: 50%;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    animation: pulse 6s ease-in-out infinite;
    pointer-events: none;
}

@keyframes pulse {
    0%, 100% { opacity: 0.5; transform: translate(-50%, -50%) scale(1); }
    50% { opacity: 0.9; transform: translate(-50%, -50%) scale(1.15); }
}

.rose {
    position: absolute;
    width: 34px;
    animation: float linear infinite;
    opacity: 0.85;
    filter: drop-shadow(0 0 6px rgba(255,77,109,0.5));
    pointer-events: none;
}

.heart {
    position: absolute;
    color: #ff4d6d;
    animation: float linear infinite;
    text-shadow: 0 0 8px rgba(255,77,109,0.8);
    pointer-events: none;
}

.sparkle {
    position: absolute;
    color: #ffd6de;
    animation: float linear infinite;
    text-shadow: 0 0 6px rgba(255,214,222,0.9);
    pointer-events: none;
}

@keyframes float {
    0% { transform: translateY(110vh) scale(0.4) rotate(0deg); opacity: 0; }
    15% { opacity: 1; }
    85% { opacity: 1; }
    100% { transform: translateY(-15vh) scale(1.3) rotate(20deg); opacity: 0; }
}

.star {
    position: absolute;
    background: white;
    border-radius: 50%;
    opacity: 0.6;
    animation: twinkle ease-in-out infinite;
    pointer-events: none;
}

@keyframes twinkle {
    0%, 100% { opacity: 0.15; }
    50% { opacity: 0.9; }
}

/* نجمة ساقطة */
.shooting-star {
    position: absolute;
    width: 2px;
    height: 2px;
    background: white;
    border-radius: 50%;
    box-shadow: 0 0 6px 2px rgba(255,255,255,0.8);
    animation: shoot 1.6s ease-in forwards;
    pointer-events: none;
}

.shooting-star::before {
    content: "";
    position: absolute;
    top: 0;
    right: 0;
    width: 90px;
    height: 1px;
    background: linear-gradient(to left, rgba(255,255,255,0.9), transparent);
    transform: translateY(0.5px);
}

@keyframes shoot {
    0% { transform: translate(0,0); opacity: 1; }
    100% { transform: translate(-260px, 260px); opacity: 0; }
}

/* ============ غلاف الرسالة (Envelope) ============ */
.envelope-screen {
    position: fixed;
    inset: 0;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: opacity 0.8s ease, visibility 0.8s ease;
}

.envelope-screen.hidden {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
}

.envelope {
    position: relative;
    width: 220px;
    height: 150px;
    animation: envFloat 3s ease-in-out infinite;
    perspective: 400px;
}

@keyframes envFloat {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
}

.envelope-body {
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, #ff4d6d, #d10035);
    border-radius: 10px;
    box-shadow: 0 10px 40px rgba(255,30,77,0.4);
}

.envelope-flap {
    position: absolute;
    top: 0;
    left: 0;
    width: 0;
    height: 0;
    border-left: 110px solid transparent;
    border-right: 110px solid transparent;
    border-top: 85px solid #ff8fa3;
    transform-origin: top;
    z-index: 3;
    filter: drop-shadow(0 4px 10px rgba(0,0,0,0.3));
}

.envelope-heart {
    position: absolute;
    top: 55%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 26px;
    z-index: 4;
    animation: heartbeat 1.4s ease-in-out infinite;
}

@keyframes heartbeat {
    0%, 100% { transform: translate(-50%, -50%) scale(1); }
    50% { transform: translate(-50%, -50%) scale(1.2); }
}

.envelope-hint {
    margin-top: 30px;
    font-size: 15px;
    color: rgba(255,255,255,0.6);
    animation: fadeBlink 2s ease-in-out infinite;
}

@keyframes fadeBlink {
    0%, 100% { opacity: 0.4; }
    50% { opacity: 1; }
}

/* ============ المحتوى ============ */
.container {
    position: relative;
    z-index: 2;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 40px 20px;
}

.card {
    max-width: 600px;
    padding: 50px 40px;
    background: rgba(255,255,255,0.03);
    border: 1px solid transparent;
    background-image: linear-gradient(rgba(15,3,9,0.75), rgba(15,3,9,0.75)), linear-gradient(135deg, #e8c9d0, #ff4d6d, #d4af8c, #ff4d6d, #e8c9d0);
    background-origin: border-box;
    background-clip: padding-box, border-box;
    border-radius: 28px;
    -webkit-backdrop-filter: blur(8px);
    backdrop-filter: blur(8px);
    box-shadow: 0 10px 50px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.05);
    opacity: 0;
    transform: scale(0.9);
    transition: opacity 1s ease, transform 1s ease;
}

.card.show {
    opacity: 1;
    transform: scale(1);
}

.title {
    font-family: "Amiri", serif;
    font-size: 32px;
    font-weight: 700;
    letter-spacing: 0.5px;
    background: linear-gradient(135deg, #e8c9d0, #ff4d6d, #d4af8c, #ff8fa3);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    margin-bottom: 8px;
    opacity: 0;
    text-shadow: 0 0 30px rgba(255,143,163,0.3);
}

.divider {
    width: 70px;
    height: 2px;
    margin: 0 auto 30px;
    background: linear-gradient(to right, transparent, #d4af8c, #ff4d6d, #d4af8c, transparent);
    opacity: 0;
}

.card.show .divider {
    animation: fadeIn 1.5s ease forwards 0.5s;
}

.card.show .title {
    animation: fadeIn 1.5s ease forwards 0.2s;
}

.quote-mark {
    font-family: "Amiri", serif;
    font-size: 50px;
    color: rgba(255,77,109,0.35);
    line-height: 0.5;
    margin-bottom: 10px;
    opacity: 0;
}

.card.show .quote-mark {
    animation: fadeIn 1.5s ease forwards 0.4s;
}

.message {
    font-family: "Amiri", serif;
    font-size: 25px;
    font-weight: 400;
    line-height: 2.5;
    letter-spacing: 0.2px;
    color: #ffffff;
    min-height: 300px;
    text-shadow: 0 2px 8px rgba(0,0,0,0.6);
}

.message .line {
    opacity: 0;
    display: block;
}

.message span {
    color: #ffd6de;
    font-weight: 700;
    text-shadow: 0 0 16px rgba(255,77,109,0.7), 0 2px 6px rgba(0,0,0,0.6);
}

.cursor-blink {
    display: inline-block;
    width: 2px;
    background: #ff8fa3;
    margin-inline-start: 2px;
    animation: blink 0.8s steps(1) infinite;
}

@keyframes blink {
    50% { opacity: 0; }
}

button {
    position: relative;
    margin-top: 40px;
    padding: 16px 36px;
    font-size: 17px;
    font-family: "Tajawal", sans-serif;
    border: 1px solid rgba(212,175,140,0.4);
    border-radius: 40px;
    background: linear-gradient(135deg, #ff4d6d, #ff1e4d);
    color: white;
    cursor: pointer;
    box-shadow: 0 4px 20px rgba(255,30,77,0.5);
    transition: 0.3s;
    opacity: 0;
    overflow: visible;
}

.card.show button {
    animation: fadeIn 1.2s ease forwards, glowPulse 2.5s ease-in-out infinite 3s;
    animation-delay: 5.5s, 6s;
}

button:hover {
    background: linear-gradient(135deg, #ff1e4d, #d10035);
    transform: scale(1.08);
    box-shadow: 0 6px 28px rgba(255,30,77,0.7);
}

button:active {
    transform: scale(0.95);
}

@keyframes glowPulse {
    0%, 100% { box-shadow: 0 4px 20px rgba(255,30,77,0.5); }
    50% { box-shadow: 0 4px 30px rgba(255,30,77,0.9); }
}

.hint {
    display: block;
    margin-top: 14px;
    font-size: 13px;
    color: rgba(255,255,255,0.4);
    opacity: 0;
}

.card.show .hint {
    animation: fadeIn 1.2s ease forwards 6s;
}

.brand-signature {
    margin-top: 34px;
    font-size: 12px;
    letter-spacing: 3px;
    background: linear-gradient(135deg, #d4af8c, #f0e0c8, #d4af8c);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    opacity: 0;
    text-transform: uppercase;
}

.card.show .brand-signature {
    animation: fadeIn 1.5s ease forwards 7s;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(15px); }
    to { opacity: 1; transform: translateY(0); }
}

@media (max-width: 480px) {
    .title { font-size: 26px; }
    .message { font-size: 20px; line-height: 2.3; min-height: 260px; }
    .card { padding: 40px 24px; }
}

/* تأثير خفيف عند الضغط في أي مكان بالصفحة */
.tap-particle {
    position: fixed;
    pointer-events: none;
    z-index: 25;
    animation: tapFloat 1s ease-out forwards;
}

@keyframes tapFloat {
    0% { transform: translate(-50%, -50%) scale(0.4); opacity: 1; }
    100% { transform: translate(calc(-50% + var(--tx)), calc(-50% + var(--ty))) scale(1.1); opacity: 0; }
}
.open-burst {
    position: fixed;
    pointer-events: none;
    z-index: 20;
    animation: openBurst 1.6s ease-out forwards;
}

@keyframes openBurst {
    0% { transform: translate(0,0) scale(0.5) rotate(0deg); opacity: 1; }
    100% { transform: translate(var(--dx), var(--dy)) scale(1.1) rotate(var(--rot)); opacity: 0; }
}
.burst-heart {
    position: fixed;
    font-size: 20px;
    color: #ff4d6d;
    pointer-events: none;
    z-index: 20;
    animation: burst 1.2s ease-out forwards;
}

@keyframes burst {
    0% { transform: translate(0,0) scale(0.6); opacity: 1; }
    100% { transform: translate(var(--dx), var(--dy)) scale(1.2); opacity: 0; }
}
</style>
</head>

<body>

<div class="background" id="bg">
    <div class="glow"></div>
</div>

<!-- شاشة الغلاف -->
<div class="envelope-screen" id="envelopeScreen" onclick="openEnvelope()">
    <div class="envelope">
        <div class="envelope-body"></div>
        <div class="envelope-flap"></div>
        <div class="envelope-heart">❤️</div>
    </div>
    <div class="envelope-hint">اضغطي عشان تفتحي الرسالة</div>
</div>

<div class="container">
    <div class="card" id="card">
        <div class="title">إليكِ ❤️</div>
        <div class="divider"></div>
        <div class="quote-mark">"</div>
        <div class="message" id="message"></div>

        <button onclick="goToSong(event)">إسمعي دي 🎶</button>
        <span class="hint">لحن صغير يقول اللي مش قادر أقوله كله بالكلام</span>
        <div class="brand-signature">أَثَر — Athar</div>
    </div>
</div>

<script>
const bg = document.getElementById("bg");

/* صور ورد */
const roses = [
    "https://cdn-icons-png.flaticon.com/512/616/616490.png",
    "https://cdn-icons-png.flaticon.com/512/2909/2909762.png"
];
const sparkles = ["✨", "💫", "⭐", "💎"];

function createElement(type) {
    let el;
    if (type === "rose") {
        el = document.createElement("img");
        el.src = roses[Math.floor(Math.random() * roses.length)];
        el.className = "rose";
    } else if (type === "sparkle") {
        el = document.createElement("div");
        el.className = "sparkle";
        el.innerHTML = sparkles[Math.floor(Math.random() * sparkles.length)];
        el.style.fontSize = (12 + Math.random() * 10) + "px";
    } else {
        el = document.createElement("div");
        el.className = "heart";
        el.innerHTML = "❤";
        el.style.fontSize = (14 + Math.random() * 10) + "px";
    }

    el.style.left = Math.random() * 100 + "vw";
    const duration = 7 + Math.random() * 6;
    el.style.animationDuration = duration + "s";

    bg.appendChild(el);
    setTimeout(() => el.remove(), duration * 1000);
}

function createStars(count) {
    for (let i = 0; i < count; i++) {
        const star = document.createElement("div");
        star.className = "star";
        const size = 1 + Math.random() * 2;
        star.style.width = size + "px";
        star.style.height = size + "px";
        star.style.left = Math.random() * 100 + "vw";
        star.style.top = Math.random() * 100 + "vh";
        star.style.animationDuration = (2 + Math.random() * 3) + "s";
        bg.appendChild(star);
    }
}
createStars(70);

function createShootingStar() {
    const s = document.createElement("div");
    s.className = "shooting-star";
    s.style.top = Math.random() * 40 + "vh";
    s.style.left = 60 + Math.random() * 35 + "vw";
    bg.appendChild(s);
    setTimeout(() => s.remove(), 1700);
}

setInterval(() => createElement("rose"), 1000);
setInterval(() => createElement("heart"), 750);
setInterval(() => createElement("sparkle"), 500);
setInterval(createShootingStar, 3500);

/* ============ أصوات بسيطة (Web Audio API) ============ */
let audioCtx;
function getAudioCtx() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    return audioCtx;
}

function playChime() {
    const ctx = getAudioCtx();
    const now = ctx.currentTime;
    const notes = [523.25, 659.25, 783.99]; // دو - مي - صول
    notes.forEach((freq, i) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "sine";
        osc.frequency.value = freq;
        osc.connect(gain);
        gain.connect(ctx.destination);
        const start = now + i * 0.12;
        gain.gain.setValueAtTime(0, start);
        gain.gain.linearRampToValueAtTime(0.15, start + 0.05);
        gain.gain.exponentialRampToValueAtTime(0.001, start + 1.1);
        osc.start(start);
        osc.stop(start + 1.2);
    });
}

function playPop() {
    const ctx = getAudioCtx();
    const now = ctx.currentTime;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = "sine";
    osc.frequency.setValueAtTime(300, now);
    osc.frequency.exponentialRampToValueAtTime(600, now + 0.12);
    gain.gain.setValueAtTime(0.2, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(now);
    osc.stop(now + 0.2);
}

/* ============ فتح الغلاف ============ */
function openEnvelope() {
    playChime();
    const screen = document.getElementById("envelopeScreen");
    const flap = document.querySelector(".envelope-flap");
    flap.style.transition = "transform 0.6s ease";
    flap.style.transform = "rotateX(180deg)";

    triggerOpenBurst();

    setTimeout(() => {
        screen.classList.add("hidden");
        document.getElementById("card").classList.add("show");
        startTypewriter();
    }, 500);
}

function triggerOpenBurst() {
    const envelope = document.querySelector(".envelope");
    const rect = envelope.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;
    const particles = ["❤", "🌹", "✨", "💫"];

    for (let i = 0; i < 30; i++) {
        const p = document.createElement("div");
        p.className = "open-burst";
        p.innerHTML = particles[Math.floor(Math.random() * particles.length)];
        p.style.fontSize = (16 + Math.random() * 16) + "px";
        p.style.left = cx + "px";
        p.style.top = cy + "px";

        const angle = Math.random() * Math.PI * 2;
        const dist = 120 + Math.random() * 220;
        p.style.setProperty("--dx", Math.cos(angle) * dist + "px");
        p.style.setProperty("--dy", Math.sin(angle) * dist - 60 + "px");
        p.style.setProperty("--rot", (Math.random() * 360 - 180) + "deg");
        p.style.animationDelay = (Math.random() * 0.15) + "s";

        document.body.appendChild(p);
        setTimeout(() => p.remove(), 1900);
    }
}

/* ============ تأثير الكتابة الحية ============ */
/* ============ قراءة بيانات العميلة من اللينك ============ */
const urlParams = new URLSearchParams(window.location.search);

// اسم العميلة - يظهر بدل "إليكِ"
const clientName = urlParams.get("name");
if (clientName) {
    document.querySelector(".title").innerHTML = clientName + " ❤️";
}

// لينك الأغنية - يستبدل اللينك الافتراضي
const songLink = urlParams.get("song") || "PUT_YOUR_SONG_LINK_HERE";

// الرسالة - تُفصل الأسطر بعلامة | وتُميَّز الكلمات بعلامتي ‹ ›
// مثال: msg=معكِ%20‹كل›%20شيء%20حلو|أنتِ%20‹الفرحة›%20كلها
const msgParam = urlParams.get("msg");
const lines = msgParam
    ? msgParam.split("|")
    : [
        "لم أكن أؤمن أن للحظات أثرًا",
        "حتى أصبحتِ أنتِ ‹اللحظة› التي تغيّر كل شيء بداخلي.",
        "",
        "معكِ فقط،",
        "أشعر أن العالم أخف،",
        "وأن ‹قلبي› وجد مكانه أخيرًا ❤️"
    ];

function startTypewriter() {
    const container = document.getElementById("message");
    container.innerHTML = "";
    let lineIndex = 0;

    function typeLine() {
        if (lineIndex >= lines.length) return;

        const lineText = lines[lineIndex];
        const lineEl = document.createElement("span");
        lineEl.className = "line";
        lineEl.style.opacity = "1";
        container.appendChild(lineEl);

        if (lineText === "") {
            lineEl.innerHTML = "<br>";
            lineIndex++;
            setTimeout(typeLine, 250);
            return;
        }

        // تحويل النص إلى مصفوفة أحرف مع علامة "مميز" للي جوه ‹...›
        const chars = [];
        let highlighted = false;
        for (const ch of lineText) {
            if (ch === "‹") { highlighted = true; continue; }
            if (ch === "›") { highlighted = false; continue; }
            chars.push({ ch, highlighted });
        }

        const cursor = document.createElement("span");
        cursor.className = "cursor-blink";
        cursor.innerHTML = "&nbsp;";

        let charIndex = 0;
        const interval = setInterval(() => {
            charIndex++;
            let html = "";
            let i = 0;
            while (i < charIndex) {
                const isHi = chars[i].highlighted;
                let segment = "";
                while (i < charIndex && chars[i] && chars[i].highlighted === isHi) {
                    segment += chars[i].ch;
                    i++;
                }
                html += isHi ? `<span>${segment}</span>` : segment;
            }
            lineEl.innerHTML = html;
            lineEl.appendChild(cursor);

            if (charIndex >= chars.length) {
                clearInterval(interval);
                cursor.remove();
                lineIndex++;
                setTimeout(typeLine, 180);
            }
        }, 28);
    }
    typeLine();
}

/* ============ تأثير الضغط في أي مكان ============ */
const tapParticles = ["❤", "✨", "💫"];
function spawnTapEffect(x, y) {
    const count = 2 + Math.floor(Math.random() * 2);
    for (let i = 0; i < count; i++) {
        const p = document.createElement("div");
        p.className = "tap-particle";
        p.innerHTML = tapParticles[Math.floor(Math.random() * tapParticles.length)];
        p.style.left = x + "px";
        p.style.top = y + "px";
        p.style.fontSize = (12 + Math.random() * 10) + "px";
        p.style.color = "#ff6b85";

        const angle = Math.random() * Math.PI * 2;
        const dist = 20 + Math.random() * 40;
        p.style.setProperty("--tx", Math.cos(angle) * dist + "px");
        p.style.setProperty("--ty", (Math.sin(angle) * dist - 25) + "px");

        document.body.appendChild(p);
        setTimeout(() => p.remove(), 1100);
    }
}

document.addEventListener("click", (e) => {
    if (e.target.closest(".envelope-screen") || e.target.closest("button")) return;
    spawnTapEffect(e.clientX, e.clientY);
});

/* ============ زر الأغنية + انفجار قلوب ============ */
function goToSong(e) {
    playPop();
    const rect = e.target.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;

    for (let i = 0; i < 14; i++) {
        const h = document.createElement("div");
        h.className = "burst-heart";
        h.innerHTML = "❤";
        const angle = Math.random() * Math.PI * 2;
        const dist = 60 + Math.random() * 80;
        h.style.setProperty("--dx", Math.cos(angle) * dist + "px");
        h.style.setProperty("--dy", Math.sin(angle) * dist + "px");
        h.style.left = cx + "px";
        h.style.top = cy + "px";
        document.body.appendChild(h);
        setTimeout(() => h.remove(), 1200);
    }

    setTimeout(() => {
        window.open(songLink, "_blank");
    }, 300);
}
</script>

</body>
</html>
